name: Deploy (production)
# Production deploy on the maintainer's self-hosted runner.
#
# SECURITY: this repo is public and accepts PRs from forks (Hacktoberfest).
# A self-hosted runner must NEVER run untrusted code, so this workflow:
#   - triggers only on push to main (code already reviewed & merged), never on pull_request*
#   - refuses to run in forks
#   - uses a dedicated runner label so no other workflow lands on this machine
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'habib-roy/indonesian-digital-tv-coverage' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, tv-digital-prod]
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # ponytail: plain directory sync to a web root on the runner host.
      # Set repo variable DEPLOY_DIR (Settings → Secrets and variables → Actions → Variables),
      # e.g. /var/www/tv-digital. Swap for rsync/ssh/docker when deploying to another machine.
      - name: Publish dist/
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          test -n "$DEPLOY_DIR" || { echo "::error::Repo variable DEPLOY_DIR is not set"; exit 1; }
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete dist/ "$DEPLOY_DIR/"
