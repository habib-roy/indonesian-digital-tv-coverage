name: Deploy (production)
# Build on a GitHub-hosted runner, then upload dist/ as a static-assets-only Cloudflare Worker.
#
# SECURITY: the token lives in the `production` environment, which only accepts `main`.
# Fork PRs never receive secrets, and this workflow never runs on pull_request*.
#
# Setup:
#   Cloudflare: a Worker named CLOUDFLARE_PROJECT_NAME with workers.dev enabled.
#               API token with only "Account → Workers Scripts → Edit".
#   GitHub (Settings → Environments → production):
#     secret:    CLOUDFLARE_API_TOKEN
#     variables: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PROJECT_NAME, PRODUCTION_URL (shown on the deployment)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'habib-roy/indonesian-digital-tv-coverage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Upload dist/ to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PROJECT; do
            test -n "${!v}" || { echo "::error::$v is not set in the production environment"; exit 1; }
          done
          # ponytail: wrangler fetched on demand (major pinned), not a devDependency; pin exact if a release breaks.
          # No wrangler config file needed: assets-only Worker, no server code. Replaces the Worker's current script.
          pnpm dlx wrangler@4 deploy --name "$PROJECT" --assets dist --compatibility-date 2026-09-01
